# Example niribg config. Copy to ~/.config/niribg/config.toml and edit.
# Every key is optional; the values shown are the built-in defaults unless
# noted. Full reference: the "Configuration" section of the README.

# Crossfade duration for blur toggles and wallpaper swaps, in milliseconds.
# 0 disables all fades. This is the duration when the overview opens (ease-out);
# the wallpaper eases back to sharp on close.
transition_ms = 250

# Closing the overview eases in, and runs for this multiple of transition_ms —
# 0.25 is a quarter as long, a quick snap back; 1.0 matches the open. 0.0..=4.0;
# 0.0 = instant.
ease_in_duration_ratio = 0.25

[blur]
# When false, niribg is only a wallpaper daemon (no blur on overview).
enable = true
# Box-blur radius, applied at 1/4 resolution — 30 is a heavy, dreamy blur.
radius = 30
# How much to darken the blurred backdrop, 0.0..=0.5.
dim = 0.15

# Applies to every output that has no [output."NAME"] section of its own.
[output.default]
path = "~/Pictures/wallpaper.jpg"
mode = "fill"        # fill | fit | stretch | center
color = "#000000"    # fill / letterbox colour; used alone if `path` is omitted

# Per-output override. Unset keys here fall back to [output.default], then to
# the built-in defaults.
# [output."DP-1"]
# path = "~/Pictures/ultrawide.jpg"
# mode = "fit"
