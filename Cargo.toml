[package]
# Published to crates.io as `niri-bg`; the binary and the `niribg` library
# target keep the compact name.
name = "niri-bg"
version = "0.1.2"
edition = "2024"
description = "Wallpaper daemon for the niri Wayland compositor, with blur on overview"
repository = "https://github.com/alexsnaps/niribg"
homepage = "https://github.com/alexsnaps/niribg"
# GPLv3: `niri-ipc` (a compile-time dependency) is GPL-3.0-or-later, and niri
# itself is GPLv3.
license = "GPL-3.0-or-later"
keywords = ["niri", "wayland", "wallpaper", "layer-shell"]
categories = ["command-line-utilities"]
readme = "README.md"
rust-version = "1.85"
exclude = [".github/", "TESTING.md", "DESIGN.md"]

[lib]
name = "niribg"
path = "src/lib.rs"

[[bin]]
name = "niribg"
path = "src/main.rs"

[dependencies]
anyhow = "1"
calloop = { version = "0.14", features = ["signals"] }
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "bmp",
    "tiff",
    "webp",
] }
# `malloc_trim` after a crossfade — return the freed blend/snapshot pages to
# the OS instead of leaving them parked in the glibc arena. Linux/glibc only;
# a no-op elsewhere. Already in the tree via `calloop`/`sctk`.
libc = "0.2"
niri-ipc = "26.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "calloop-wayland-source"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[build-dependencies]
# `build.rs` compiles `src/cli.rs` (clap derive) to emit the man page and
# shell completions.
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"

[profile.release]
panic = "abort"
strip = true
lto = "thin"

[lints.clippy]
# keep CI honest; opt into the pedantic lints we actually want later
all = { level = "warn", priority = -1 }

# Extra files bundled into the release tarballs. The generated man page and
# shell completions live in OUT_DIR (see build.rs) and are not listed here.
[package.metadata.dist]
include = ["LICENSE", "README.md", "CHANGELOG.md", "examples/config.toml", "contrib/niribg.service"]

# `cargo dist init` reads this and (re)generates .github/workflows/release.yml.
# Pin the version so CI is reproducible; bump deliberately.
[workspace.metadata.dist]
cargo-dist-version = "0.28.0"
ci = "github"
installers = ["shell"]
targets = ["x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
install-updater = false
pr-run-mode = "plan"
