[package]
name = "niribg"
version = "0.1.0"
edition = "2024"
description = "Wallpaper daemon for the niri Wayland compositor, with blur on overview"
repository = "https://github.com/alexsnaps/niribg"
license = "Apache-2.0"
keywords = ["niri", "wayland", "wallpaper", "layer-shell"]
categories = ["command-line-utilities"]
readme = "README.md"
rust-version = "1.85"

[dependencies]
anyhow = "1"
calloop = { version = "0.14", features = ["signals"] }
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "bmp",
    "tiff",
    "webp",
] }
niri-ipc = "26.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay-client-toolkit = "0.21"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[profile.release]
panic = "abort"
strip = true
lto = "thin"

[lints.clippy]
# keep CI honest; opt into the pedantic lints we actually want later
all = { level = "warn", priority = -1 }
