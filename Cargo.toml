[package]
name = "niribg"
version = "0.1.0"
edition = "2024"
description = "Wallpaper daemon for the niri Wayland compositor, with blur on overview"
repository = "https://github.com/alexsnaps/niribg"
license = "Apache-2.0"
keywords = ["niri", "wayland", "wallpaper", "layer-shell"]
categories = ["command-line-utilities"]
readme = "README.md"
rust-version = "1.85"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
panic = "abort"
strip = true
lto = "thin"

[lints.clippy]
# keep CI honest; opt into the pedantic lints we actually want later
all = { level = "warn", priority = -1 }
